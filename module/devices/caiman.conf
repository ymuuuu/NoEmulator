# Device preset: Pixel 9 Pro ("caiman"), Android 16.
#
# Built by scripts/make_device_preset.sh from Caiman_CP1A.260505.005.zip,
# sha256 6792f667dc67f594ca408c0b1dd066d1ac89bf5b3d6e0120b42d45874b8ddf02,
# a Pixel-Props dump of a real device's build.prop files. Rebuild it from the zip
# rather than editing it (docs/research/pixel-device-presets.md).
#
# Not in any build.prop, so taken from the AOSP device tree (device/google):
# ro.hardware, ro.boot.hardware and ro.hardware.power are the SoC name, zumapro
# (zumapro/device.mk:51);
# ro.product.board is caiman (caimito/caiman/BoardConfig.mk:18);
# ro.build.product is the codename, as in devices/shiba.conf.

android 16

setprop ro.build.fingerprint google/caiman/caiman:16/CP1A.260505.005/15081906:user/release-keys
setprop ro.product.model Pixel 9 Pro
setprop ro.product.name caiman
setprop ro.product.board caiman
setprop ro.hardware zumapro
setprop ro.boot.hardware zumapro
setprop ro.hardware.power zumapro
